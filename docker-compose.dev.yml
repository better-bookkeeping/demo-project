name: setlist

services:
  postgres:
    image: postgres:16-alpine
    container_name: setlist-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: setlist
    ports:
      - "55432:5432"
    volumes:
      - setlist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    container_name: setlist-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/setlist
      - PORT=3000
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: package.json
        - action: rebuild
          path: bun.lock

volumes:
  setlist_postgres_data:
